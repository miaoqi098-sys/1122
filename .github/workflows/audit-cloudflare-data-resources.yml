name: Audit Cloudflare Data Resources

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/audit-cloudflare-data-resources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify audit credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN missing" >&2; exit 2; }
          ACCOUNT_ID=$(node -e "const x=require('./对外连接板块/01_1122连接Cloudflare/cloudflare.config.json');process.stdout.write(x.account_id)")
          test -n "$ACCOUNT_ID"
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Read-only audit initialized."

      - name: Audit D1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" > /tmp/d1.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/d1.json','utf8'));
          if(x.success!==true) process.exit(1);
          const rows=x.result||[];
          const d=rows.find(v=>v.name==='1122-core');
          if(!d){console.error('D1 1122-core: MISSING');process.exit(2)}
          console.log(JSON.stringify({d1:{name:d.name,id:d.uuid||d.id,status:'READY'}},null,2));
          NODE

      - name: Audit KV
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/storage/kv/namespaces?per_page=100" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" > /tmp/kv.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/kv.json','utf8'));
          if(x.success!==true) process.exit(1);
          const rows=x.result||[];
          const expectedId='daf3ad0cb59b4ada940e5f02405d4351';
          const ns=rows.find(v=>v.id===expectedId);
          console.log(JSON.stringify({kv:{expected_id:expectedId,found:Boolean(ns),title:ns?.title||null,status:ns?'READY':'MISSING'}},null,2));
          if(!ns) process.exit(2);
          NODE

      - name: Audit R2
        shell: bash
        run: |
          set -uo pipefail
          HTTP=$(curl -sS -o /tmp/r2.json -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json")
          node - "$HTTP" <<'NODE'
          const fs=require('fs');
          const http=process.argv[2];
          let x={}; try{x=JSON.parse(fs.readFileSync('/tmp/r2.json','utf8'))}catch{}
          const rows=Array.isArray(x?.result?.buckets)?x.result.buckets:Array.isArray(x?.result)?x.result:[];
          const bucket=rows.find(v=>(v.name||v.bucket_name)==='1122-data-archive');
          const error=x?.errors?.[0]||null;
          console.log(JSON.stringify({r2:{http_status:Number(http),api_success:x.success===true,bucket_found:Boolean(bucket),bucket_name:bucket?.name||bucket?.bucket_name||null,status:bucket?'READY':(x.success===true?'BUCKET_MISSING':'UNAVAILABLE_OR_PERMISSION'),error_code:error?.code||null,error_message:error?.message||null}},null,2));
          NODE
          # R2 is optional during bootstrap; audit reports state but does not fail the job.

      - name: Audit Data Layer runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 \
            https://1122-data-layer.zhangshuaibing01.workers.dev/status > /tmp/data-layer.json
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/data-layer.json','utf8'));
          const out={service:d.service,version:d.version,d1:d.storage?.d1,r2:d.storage?.r2,kv:d.storage?.kv,summary:d.summary,sources:d.sources};
          console.log(JSON.stringify(out,null,2));
          if(d.success!==true||d.storage?.d1?.ready!==true) process.exit(1);
          NODE

      - name: Audit Amazon bridge runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 2 \
            https://1122-amazon-sp-api-bridge.zhangshuaibing01.workers.dev/ > /tmp/amazon.json
          node - <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/amazon.json','utf8'));
          console.log(JSON.stringify({service:d.service||'1122-amazon-sp-api-bridge',status:d.status||null,version:d.version||null,productState:d.productState,coreData:d.coreData,archive:d.archive},null,2));
          if(d.productState!==true||d.coreData!==true) process.exit(1);
          NODE

      - name: Audit repository binding declarations
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const data=fs.readFileSync('数据板块/08_存储与访问层/cloudflare/wrangler.toml','utf8');
          const amazon=fs.readFileSync('对外连接板块/02_1122连接亚马逊API/worker/wrangler.toml','utf8');
          const has=(text,b)=>text.includes(`binding = "${b}"`);
          console.log(JSON.stringify({bindings:{data_layer:{CORE_DB:has(data,'CORE_DB'),PRODUCT_STATE:has(data,'PRODUCT_STATE'),DATA_ARCHIVE:has(data,'DATA_ARCHIVE')},amazon_bridge:{CORE_DB:has(amazon,'CORE_DB'),PRODUCT_STATE:has(amazon,'PRODUCT_STATE'),DATA_ARCHIVE:has(amazon,'DATA_ARCHIVE')}}},null,2));
          NODE

      - name: Audit conclusion
        run: |
          echo "Read-only Cloudflare data resource audit completed. No Cloudflare resource was created, changed, or deleted."
