name: Dispatch Codex Cloud Task

on:
  push:
    branches: [codex-dispatch]
    paths:
      - '.codex-cloud/inbox/current.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codex-cloud-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify required OpenAI credential
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY" || {
            echo 'OPENAI_API_KEY GitHub Actions secret is required for Codex Cloud dispatch.' >&2
            exit 2
          }
      - name: Read task id
        id: task
        shell: bash
        run: |
          test -f .codex-cloud/inbox/current.json
          TASK_ID="$(python -c "import json; print(json.load(open('.codex-cloud/inbox/current.json', encoding='utf-8'))['task_id'])")"
          SAFE_TASK_ID="$(printf '%s' "$TASK_ID" | sed 's/[^A-Za-z0-9._-]/_/g')"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "safe_task_id=$SAFE_TASK_ID" >> "$GITHUB_OUTPUT"
      - name: Run OpenAI-hosted Codex task
        id: dispatch
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_AGENT_MODEL: ${{ vars.OPENAI_AGENT_MODEL }}
        run: |
          if [ -z "$OPENAI_AGENT_MODEL" ]; then export OPENAI_AGENT_MODEL='gpt-5.4'; fi
          python '对外连接板块/01_GPT链接Codex/02_CodexCloud执行器/dispatch.py' \
            --task .codex-cloud/inbox/current.json \
            --result ".codex-cloud/results/${{ steps.task.outputs.safe_task_id }}.json" \
            --checkout-root .
      - name: Commit result to codex-dispatch
        if: always()
        shell: bash
        run: |
          git config user.name '1122 Codex Cloud Dispatcher'
          git config user.email 'codex-cloud-dispatch@users.noreply.github.com'
          git add .codex-cloud/results || true
          if git diff --cached --quiet; then
            echo 'No result file to commit.'
          else
            git commit -m "codex cloud: result ${{ steps.task.outputs.task_id }}"
            git push origin HEAD:codex-dispatch
          fi
      - name: Enforce task result
        if: steps.dispatch.outcome != 'success'
        run: exit 1
