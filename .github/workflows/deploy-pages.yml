name: Deploy 1122 Web Agent

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "amazon-sp-api.html"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "1122-web-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 2
          fi

      - name: Build safe frontend artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html dist/index.html
          if [ -f amazon-sp-api.html ]; then
            cp amazon-sp-api.html dist/amazon-sp-api.html
          fi
          printf 'User-agent: *\nDisallow:\n' > dist/robots.txt
          echo "Frontend artifact contains only approved web files:"
          find dist -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Ensure Cloudflare Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4 pages project list 2>&1 | grep -q '1122-web-agent'; then
            npx --yes wrangler@4 pages project create 1122-web-agent --production-branch=main
          else
            echo "Cloudflare Pages project 1122-web-agent already exists"
          fi

      - name: Deploy latest 1122
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist --project-name=1122-web-agent --branch=main --commit-dirty=true
          echo "Stable URL: https://1122-web-agent.pages.dev"

# Private GitHub source -> safe frontend artifact -> Cloudflare Pages
