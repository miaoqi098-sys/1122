name: Deploy Sif MCP Bridge

on:
  push:
    branches: ["main"]
    paths:
      - "对外连接板块/03_1122连接Sif/worker/**"
      - ".github/workflows/deploy-sif-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 对外连接板块/03_1122连接Sif/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 2
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Sif Bridge
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify real Sif MCP connection
        shell: bash
        run: |
          sleep 3
          curl -fsS "https://1122-sif-bridge.zhangshuaibing01.workers.dev/connection-status" -o /tmp/sif-status.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/sif-status.json','utf8'));if(d.success!==true){console.error('Sif MCP check failed:',d.message||d.error||d);process.exit(1)};console.log('Sif MCP connected');console.log('Protocol:',d.sif?.protocolVersion||'unknown');console.log('Tools:',d.sif?.toolCount??'unknown');console.log('Server:',d.sif?.serverName||'Sif MCP');"
