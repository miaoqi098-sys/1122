name: Fix Sif Stale Product Rotation

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-sif-stale-selection.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch stale-selection query
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('对外连接板块/03_1122连接Sif/worker/worker.js')
          s = p.read_text(encoding='utf-8')
          old = '''     LEFT JOIN (
       SELECT product_id, MAX(observed_at) AS last_sif_observed_at
       FROM sif_asin_profile_snapshots
       GROUP BY product_id
     ) s ON s.product_id = p.product_id'''
          new = '''     LEFT JOIN (
       SELECT product_id, MAX(observed_at) AS last_sif_observed_at
       FROM external_tool_observations
       WHERE provider = 'sif' AND subject_type = 'asin'
       GROUP BY product_id
     ) s ON s.product_id = p.product_id'''
          if old not in s:
              raise SystemExit('Expected stale-selection block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '对外连接板块/03_1122连接Sif/worker/worker.js'
          git commit -m "fix: rotate Sif ASINs after any completed observation"
          git push

      - name: Deploy patched Sif bridge
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --config '对外连接板块/03_1122连接Sif/worker/wrangler.toml'

      - name: Verify Sif connection
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          curl -fsS https://1122-sif-bridge.zhangshuaibing01.workers.dev/connection-status > /tmp/sif-status.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/sif-status.json','utf8'));if(!d.success){console.error(d.message||d.error||'Sif verification failed');process.exit(1)};console.log('Sif bridge healthy, tools:',d.sif?.toolCount);"

# trigger: stale-rotation-v1
