name: GPT Codex Gateway Runtime

on:
  pull_request:
    paths:
      - '10_对外链接/01_GPT链接Codex/03_本地网关/runtime/**'
      - '10_对外链接/01_GPT链接Codex/07_运行与恢复/*gateway.ps1'
      - '.github/workflows/gpt-codex-gateway-runtime.yml'
  push:
    branches: [main]
    paths:
      - '10_对外链接/01_GPT链接Codex/03_本地网关/runtime/**'
      - '10_对外链接/01_GPT链接Codex/07_运行与恢复/*gateway.ps1'
      - '.github/workflows/gpt-codex-gateway-runtime.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: '10_对外链接/01_GPT链接Codex/03_本地网关/runtime'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Test
        run: pytest -q
