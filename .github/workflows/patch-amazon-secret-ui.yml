name: Patch Amazon Secret UI

on:
  push:
    branches: [main]
    paths:
      - 'tools/patch-amazon-secret-ui.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch index.html
        run: node tools/patch-amazon-secret-ui.mjs
      - name: Commit patched UI
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: switch Amazon UI to Worker Secret mode"
          git push
