name: Patch Data Layer Persistence V1

on:
  push:
    branches: ["main"]
    paths:
      - "tools/patch-data-layer-persistence-v1.mjs"
      - ".github/workflows/patch-data-layer-persistence-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Amazon persistence pipeline
        run: node tools/patch-data-layer-persistence-v1.mjs
      - name: Commit worker
        shell: bash
        run: |
          set -euo pipefail
          TARGET='对外连接板块/02_1122连接亚马逊API/worker/worker.js'
          if git diff --quiet -- "$TARGET"; then
            echo "No worker change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "feat: persist Amazon snapshots permanently in D1"
          git push
