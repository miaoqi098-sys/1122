name: Patch Data Layer UI V1

on:
  push:
    branches: ["main"]
    paths:
      - "tools/patch-data-layer-ui-v1.mjs"
      - ".github/workflows/patch-data-layer-ui-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Data Layer UI
        run: node tools/patch-data-layer-ui-v1.mjs
      - name: Commit UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No UI change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add Data Layer system status UI"
          git push
