name: Patch Operations Product Center

on:
  push:
    branches: ["main"]
    paths:
      - "tools/patch-operations-product-center.mjs"
      - ".github/workflows/patch-operations-product-center.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch operations UI
        run: node tools/patch-operations-product-center.mjs

      - name: Commit patched index
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No index.html changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: launch product operations center V1"
          git push
