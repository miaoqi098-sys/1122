name: Patch Product Cockpit V2

on:
  push:
    branches: ["main"]
    paths:
      - "tools/patch-product-cockpit-v2.mjs"
      - ".github/workflows/patch-product-cockpit-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch product cockpit
        run: node tools/patch-product-cockpit-v2.mjs
      - name: Commit UI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No UI change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: redesign product center and product cockpit V2"
          git push

# trigger: product-cockpit-v2
