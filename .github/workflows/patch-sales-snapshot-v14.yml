name: Patch SalesSnapshot V1.4

on:
  push:
    branches: ["main"]
    paths:
      - "tools/patch-sales-snapshot-v14.mjs"
      - ".github/workflows/patch-sales-snapshot-v14.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Patch Amazon bridge
        run: node tools/patch-sales-snapshot-v14.mjs
      - name: Commit worker
        shell: bash
        run: |
          set -euo pipefail
          TARGET='对外连接板块/02_1122连接亚马逊API/worker/worker.js'
          if git diff --quiet -- "$TARGET"; then
            echo "No worker change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "feat: add SalesSnapshot v1.4 and Cloudflare Pages CORS"
          git push

# trigger: sales-v1.4
