name: Wire UI Bootstrap API V1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-ui-bootstrap-api-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wire-ui-bootstrap-api-v1
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch data layer Worker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('数据板块/08_存储与访问层/cloudflare/worker.js')
          s=p.read_text()
          imp="import { buildUiBootstrap } from './ui-bootstrap.js';\n"
          if imp not in s:
              marker='const ALLOWED_ORIGINS = new Set(['
              if marker not in s: raise SystemExit('import marker not found')
              s=s.replace(marker, imp+'\n'+marker, 1)
          route="""    if (request.method === 'GET' && url.pathname === '/api/v1/ui/bootstrap') {
      const marketplace = String(url.searchParams.get('marketplace') || 'US').toUpperCase();
      const payload = await buildUiBootstrap(env, { marketplace });
      return json(payload, 200, origin);
    }

"""
          if "url.pathname === '/api/v1/ui/bootstrap'" not in s:
              marker="    if (request.method === 'GET' && (url.pathname === '/' || url.pathname === '/status')) {"
              if marker not in s: raise SystemExit('route marker not found')
              s=s.replace(marker, route+marker, 1)
          p.write_text(s)
          PY
          node --check '数据板块/08_存储与访问层/cloudflare/worker.js'
          node --check '数据板块/08_存储与访问层/cloudflare/ui-bootstrap.js'
          grep -q "buildUiBootstrap" '数据板块/08_存储与访问层/cloudflare/worker.js'
          grep -q "/api/v1/ui/bootstrap" '数据板块/08_存储与访问层/cloudflare/worker.js'
      - name: Commit wiring
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Worker already wired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '数据板块/08_存储与访问层/cloudflare/worker.js'
          git commit -m 'feat(ui-api): expose read-only UI bootstrap endpoint'
          git push origin HEAD:main

