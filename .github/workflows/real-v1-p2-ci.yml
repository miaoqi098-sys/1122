name: real-v1-p2-ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-product-identity-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install P2 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pydantic>=2.9,<3.0" "pytest>=8.3,<9.0"

      - name: Run ProductIdentity tests
        working-directory: 真实实现工程/02_ProductIdentity身份服务/01_身份存储与解析
        run: python -m pytest -q
