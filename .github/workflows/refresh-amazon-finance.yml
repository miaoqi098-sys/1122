name: Refresh Amazon Finance Snapshot

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-amazon-finance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 对外连接板块/02_1122连接亚马逊API/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Create temporary internal authorization
        id: auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put OPERATIONS_REFRESH_TOKEN >/dev/null
          sleep 5

      - name: Refresh FinanceSnapshot
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/finance.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/json' \
            https://1122-amazon-sp-api-bridge.zhangshuaibing01.workers.dev/internal/refresh-finance)
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/finance.json','utf8'));if(!d.success||!d.ready){console.error('FinanceSnapshot refresh failed:',d.message||d.error||'unknown');process.exit(1)};console.log(JSON.stringify({financeSnapshot:{success:true,ready:true,marketplace:d.marketplace,updatedAt:d.updatedAt,source:d.source,currency:d.currency,transactionCount:d.transactionCount,transactionTypeCount:d.transactionTypeCount,pages:d.pages,postedAfter:d.postedAfter,postedBefore:d.postedBefore,detailVisibility:d.detailVisibility}},null,2))"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Finance refresh returned HTTP $HTTP_CODE" >&2
            exit 5
          fi

      - name: Rotate internal authorization
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ROTATED=$(openssl rand -hex 32)
          echo "::add-mask::$ROTATED"
          printf '%s' "$ROTATED" | npx --yes wrangler@4 secret put OPERATIONS_REFRESH_TOKEN >/dev/null
          echo "Internal authorization rotated."

# Validation rerun after US marketplace-filter correction. Real financial amounts are not printed.
