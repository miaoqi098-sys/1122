name: Refresh Amazon Product State

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-amazon-product-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 对外连接板块/02_1122连接亚马逊API/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh private ProductIdentity snapshot
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 2
          fi

          TOKEN=$(openssl rand -hex 32)
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put OPERATIONS_REFRESH_TOKEN >/dev/null
          sleep 5

          HTTP_CODE=000
          for attempt in 1 2 3 4 5; do
            HTTP_CODE=$(curl -sS -o /tmp/product-status.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/json' \
              https://1122-amazon-sp-api-bridge.zhangshuaibing01.workers.dev/internal/refresh-product-identities)
            if [ "$HTTP_CODE" != "401" ]; then
              break
            fi
            sleep 3
          done

          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/product-status.json','utf8'));if(!d.success){console.error('ProductIdentity refresh failed:',d.message||d.error||'unknown');process.exit(1)};console.log(JSON.stringify({success:true,marketplace:d.marketplace,productCount:d.productCount,pages:d.pages,updatedAt:d.updatedAt,source:d.source,detailVisibility:d.detailVisibility,v12:d.v12||null,v13:d.v13||null},null,2))"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Refresh endpoint returned HTTP $HTTP_CODE" >&2
            exit 4
          fi

          ROTATED=$(openssl rand -hex 32)
          printf '%s' "$ROTATED" | npx --yes wrangler@4 secret put OPERATIONS_REFRESH_TOKEN >/dev/null
          echo "Private ProductIdentity + InventorySnapshot refresh completed; internal token rotated."

# V1.3 aggregate validation only; no SKU/ASIN/SellerId/price/inventory-unit details are logged.
