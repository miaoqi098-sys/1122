name: Refresh Amazon Product State

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-amazon-product-state.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 对外连接板块/02_1122连接亚马逊API/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh private ProductIdentity and Sales snapshots
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 2
          fi

          TOKEN=$(openssl rand -hex 32)
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put OPERATIONS_REFRESH_TOKEN >/dev/null
          sleep 5

          PRODUCT_HTTP=000
          for attempt in 1 2 3 4 5; do
            PRODUCT_HTTP=$(curl -sS -o /tmp/product-status.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Accept: application/json' \
              https://1122-amazon-sp-api-bridge.zhangshuaibing01.workers.dev/internal/refresh-product-identities)
            if [ "$PRODUCT_HTTP" != "401" ]; then break; fi
            sleep 3
          done

          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/product-status.json','utf8'));if(!d.success){console.error('ProductIdentity refresh failed:',d.message||d.error||'unknown');process.exit(1)};console.log(JSON.stringify({productIdentity:{success:true,marketplace:d.marketplace,productCount:d.productCount,updatedAt:d.updatedAt,v12:d.v12||null,v13:d.v13||null}},null,2))"
          if [ "$PRODUCT_HTTP" -lt 200 ] || [ "$PRODUCT_HTTP" -ge 300 ]; then
            echo "Product refresh endpoint returned HTTP $PRODUCT_HTTP" >&2
            exit 4
          fi

          SALES_HTTP=$(curl -sS -o /tmp/sales-status.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/json' \
            https://1122-amazon-sp-api-bridge.zhangshuaibing01.workers.dev/internal/refresh-sales)

          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/sales-status.json','utf8'));if(!d.success){console.error('SalesSnapshot refresh failed:',d.message||d.error||'unknown');process.exit(1)};console.log(JSON.stringify({salesSnapshot:{success:true,ready:d.ready,marketplace:d.marketplace,updatedAt:d.updatedAt,source:d.source,currency:d.currency,rangesAvailable:d.rangesAvailable,detailVisibility:d.detailVisibility}},null,2))"
          if [ "$SALES_HTTP" -lt 200 ] || [ "$SALES_HTTP" -ge 300 ]; then
            echo "Sales refresh endpoint returned HTTP $SALES_HTTP" >&2
            exit 5
          fi

          ROTATED=$(openssl rand -hex 32)
          printf '%s' "$ROTATED" | npx --yes wrangler@4 secret put OPERATIONS_REFRESH_TOKEN >/dev/null
          echo "Private ProductIdentity + InventorySnapshot + SalesSnapshot refresh completed; internal token rotated."

# Aggregate validation only: no SKU/ASIN/SellerId/price/inventory-unit/sales-amount details are logged.
