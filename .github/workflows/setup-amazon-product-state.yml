name: Setup Amazon Product State

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/setup-amazon-product-state.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 对外连接板块/02_1122连接亚马逊API/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare token
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing" >&2
            exit 2
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Create private ProductIdentity KV
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if grep -q 'binding = "PRODUCT_STATE"' wrangler.toml; then
            echo "PRODUCT_STATE binding already exists"
            exit 0
          fi
          OUT=$(npx --yes wrangler@4 kv namespace create PRODUCT_STATE 2>&1)
          echo "$OUT"
          ID=$(printf '%s\n' "$OUT" | grep -oE 'id = "[a-f0-9]+"' | head -1 | cut -d'"' -f2)
          if [ -z "$ID" ]; then
            echo "Could not parse KV namespace id" >&2
            exit 3
          fi
          printf '\n[[kv_namespaces]]\nbinding = "PRODUCT_STATE"\nid = "%s"\n' "$ID" >> wrangler.toml
          echo "KV binding prepared."

      - name: Commit KV binding
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          if git diff --quiet -- '对外连接板块/02_1122连接亚马逊API/worker/wrangler.toml'; then
            echo "No binding change to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '对外连接板块/02_1122连接亚马逊API/worker/wrangler.toml'
            git commit -m "chore: bind private ProductIdentity KV"
            git push
          fi

      - name: Deploy Amazon Worker with KV
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy

      - name: Set ephemeral refresh token and refresh ProductIdentity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put OPERATIONS_REFRESH_TOKEN >/dev/null
          HTTP_CODE=$(curl -sS -o /tmp/product-status.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Accept: application/json' https://1122-amazon-sp-api-bridge.zhangshuaibing01.workers.dev/internal/refresh-product-identities)
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/product-status.json','utf8'));if(!d.success){console.error('ProductIdentity refresh failed:',d.message||d.error||'unknown');process.exit(1)};console.log(JSON.stringify({success:true,marketplace:d.marketplace,productCount:d.productCount,pages:d.pages,updatedAt:d.updatedAt,source:d.source,detailVisibility:d.detailVisibility},null,2))"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Refresh endpoint returned HTTP $HTTP_CODE" >&2
            exit 4
          fi
          ROTATED=$(openssl rand -hex 32)
          printf '%s' "$ROTATED" | npx --yes wrangler@4 secret put OPERATIONS_REFRESH_TOKEN >/dev/null
          echo "Internal refresh token rotated after use."

# trigger: valid-yaml-v2
