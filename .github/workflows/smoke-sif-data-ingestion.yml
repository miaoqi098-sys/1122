name: Smoke Sif Intelligence Ingestion

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/smoke-sif-data-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 1122-sif-ingestion-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 对外连接板块/03_1122连接Sif/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create temporary internal authorization
        id: auth
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          printf '%s' "$TOKEN" | npx --yes wrangler@4 secret put SIF_INTERNAL_TOKEN >/dev/null
          sleep 5

      - name: Sync one stale US ASIN from Sif to D1
        shell: bash
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/sif-sync.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/json' \
            'https://1122-sif-bridge.zhangshuaibing01.workers.dev/internal/sync-asins?marketplace=US&limit=1')
          cat /tmp/sif-sync.json
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/tmp/sif-sync.json','utf8'));if(!d.success){console.error(d.message||d.error||'Sif sync failed');process.exit(1)};if(Number(d.productsSelected||0)<1){console.error('No product selected for Sif smoke test');process.exit(2)};console.log('Sif sync summary:',JSON.stringify(d.summary||{}));"
          test "$CODE" -ge 200 -a "$CODE" -lt 300

      - name: Verify Sif observations persisted in D1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute 1122-core --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM external_tool_observations WHERE provider='sif') AS observations, (SELECT COUNT(*) FROM sif_asin_profile_snapshots) AS profiles, (SELECT COUNT(*) FROM sif_asin_traffic_daily) AS traffic_rows, (SELECT COUNT(*) FROM sif_asin_keyword_signals) AS keyword_rows, (SELECT COUNT(*) FROM sif_asin_ad_structure_snapshots) AS ad_structure_rows;" > /tmp/sif-d1.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/sif-d1.json','utf8'));const r=x?.[0]?.results?.[0]||x?.[0]?.result?.[0];if(!r){process.exit(1)};console.log(JSON.stringify({sifD1:r},null,2));if(Number(r.observations)<4){console.error('Expected at least four persisted Sif tool observations');process.exit(2)}"

      - name: Rotate internal authorization
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ROTATED=$(openssl rand -hex 32)
          echo "::add-mask::$ROTATED"
          printf '%s' "$ROTATED" | npx --yes wrangler@4 secret put SIF_INTERNAL_TOKEN >/dev/null
          echo "Sif internal authorization rotated."
