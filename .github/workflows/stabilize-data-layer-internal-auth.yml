name: Stabilize Data Layer Internal Auth CI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/stabilize-data-layer-internal-auth.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Serialize every Data Layer internal-token mutator
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          self_name = 'stabilize-data-layer-internal-auth.yml'
          lock_group = '1122-data-layer-internal-auth'
          matched = []
          changed = []

          for path in sorted(list(root.glob('*.yml')) + list(root.glob('*.yaml'))):
              if path.name == self_name:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'secret put DATA_LAYER_INTERNAL_TOKEN' not in text:
                  continue

              matched.append(path.as_posix())
              lines = text.splitlines(keepends=True)
              jobs_idx = next((i for i, line in enumerate(lines) if line.startswith('jobs:')), None)
              if jobs_idx is None:
                  raise SystemExit(f'{path}: top-level jobs: not found')

              concurrency_idx = next((i for i, line in enumerate(lines[:jobs_idx]) if line.startswith('concurrency:')), None)
              modified = False

              if concurrency_idx is None:
                  block = [
                      'concurrency:\n',
                      f'  group: {lock_group}\n',
                      '  cancel-in-progress: false\n',
                      '\n',
                  ]
                  lines[jobs_idx:jobs_idx] = block
                  modified = True
              else:
                  end_idx = concurrency_idx + 1
                  while end_idx < len(lines):
                      line = lines[end_idx]
                      if line.strip() == '' or line.startswith(' ') or line.startswith('\t'):
                          end_idx += 1
                          continue
                      break

                  group_idx = next((i for i in range(concurrency_idx + 1, end_idx) if lines[i].lstrip().startswith('group:')), None)
                  cancel_idx = next((i for i in range(concurrency_idx + 1, end_idx) if lines[i].lstrip().startswith('cancel-in-progress:')), None)

                  wanted_group = f'  group: {lock_group}\n'
                  if group_idx is None:
                      lines.insert(concurrency_idx + 1, wanted_group)
                      modified = True
                      end_idx += 1
                      if cancel_idx is not None:
                          cancel_idx += 1
                  elif lines[group_idx] != wanted_group:
                      lines[group_idx] = wanted_group
                      modified = True

                  wanted_cancel = '  cancel-in-progress: false\n'
                  if cancel_idx is None:
                      insert_at = concurrency_idx + 2
                      lines.insert(insert_at, wanted_cancel)
                      modified = True
                  elif lines[cancel_idx] != wanted_cancel:
                      lines[cancel_idx] = wanted_cancel
                      modified = True

              new_text = ''.join(lines)
              if modified and new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(path.as_posix())

          print('Matched token-mutating workflows:')
          for p in matched:
              print(f'  - {p}')
          print('Changed workflows:')
          for p in changed:
              print(f'  - {p}')

          if not matched:
              raise SystemExit('No workflow mutating DATA_LAYER_INTERNAL_TOKEN was found')

          Path('/tmp/data-layer-lock-matched.txt').write_text('\n'.join(matched) + '\n', encoding='utf-8')
          Path('/tmp/data-layer-lock-changed.txt').write_text('\n'.join(changed) + ('\n' if changed else ''), encoding='utf-8')
          PY

          echo '--- unified concurrency blocks ---'
          while IFS= read -r f; do
            echo "### $f"
            grep -A2 '^concurrency:' "$f"
          done < /tmp/data-layer-lock-matched.txt

      - name: Commit concurrency stabilization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/workflows; then
            echo 'All token-mutating workflows already use the shared lock.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows
            git commit -m 'ci: serialize Data Layer internal auth rotation'
            git push origin HEAD:main
          fi

      - name: Dispatch concurrent smoke tests
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          START_EPOCH=$(date -u +%s)
          echo "start_epoch=$START_EPOCH" >> "$GITHUB_OUTPUT"

          workflows=(
            'smoke-derived-layer-v1.yml'
            'smoke-a1-event-intake-v1.yml'
            'smoke-s02-context-v1.yml'
          )

          for wf in "${workflows[@]}"; do
            echo "Dispatching $wf"
            gh workflow run "$wf" --ref main
          done

          sleep 8
          : > /tmp/dispatched-runs.txt

          for wf in "${workflows[@]}"; do
            run_id=''
            for attempt in $(seq 1 12); do
              run_id=$(gh run list \
                --workflow "$wf" \
                --event workflow_dispatch \
                --branch main \
                --limit 10 \
                --json databaseId,createdAt \
                --jq ".[] | select((.createdAt | fromdateiso8601) >= $START_EPOCH) | .databaseId" \
                | head -n1 || true)
              if [ -n "$run_id" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$run_id" ]; then
              echo "Could not resolve dispatched run for $wf" >&2
              exit 1
            fi
            echo "$wf $run_id" | tee -a /tmp/dispatched-runs.txt
          done

      - name: Prove shared-lock serialization and wait for green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo 'Initial run states:'
          while read -r wf run_id; do
            gh run view "$run_id" --json databaseId,workflowName,status,conclusion,createdAt,startedAt --jq '.'
          done < /tmp/dispatched-runs.txt

          failed=0
          while read -r wf run_id; do
            echo "=== Waiting for $wf / run $run_id ==="
            if ! gh run watch "$run_id" --exit-status; then
              failed=1
            fi
          done < /tmp/dispatched-runs.txt

          echo 'Final run states:'
          while read -r wf run_id; do
            gh run view "$run_id" --json databaseId,workflowName,status,conclusion,createdAt,startedAt,updatedAt --jq '.'
          done < /tmp/dispatched-runs.txt

          if [ "$failed" -ne 0 ]; then
            echo 'At least one smoke workflow failed.' >&2
            exit 1
          fi

      - name: Verify repository lock invariant
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          expected = 'group: 1122-data-layer-internal-auth'
          offenders = []
          checked = []
          for path in sorted(list(root.glob('*.yml')) + list(root.glob('*.yaml'))):
              if path.name == 'stabilize-data-layer-internal-auth.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              if 'secret put DATA_LAYER_INTERNAL_TOKEN' not in text:
                  continue
              checked.append(path.as_posix())
              if expected not in text or 'cancel-in-progress: false' not in text:
                  offenders.append(path.as_posix())

          print('Verified workflows:')
          for p in checked:
              print(f'  - {p}')
          if offenders:
              raise SystemExit('Shared-lock invariant failed: ' + ', '.join(offenders))
          if len(checked) < 3:
              raise SystemExit(f'Expected at least 3 token-mutating workflows, found {len(checked)}')
          print(f'PASS: {len(checked)} workflows share 1122-data-layer-internal-auth')
          PY

      - name: Self-clean temporary stabilization workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm '.github/workflows/stabilize-data-layer-internal-auth.yml'
          git commit -m 'chore: remove temporary CI stabilization workflow'
          git push origin HEAD:main
