name: Test Sif Connection

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-sif-connection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run one Sif ASIN query
        shell: bash
        run: |
          set -euo pipefail
          echo '=== One-shot Sif ASIN query ==='
          curl -sS https://1122-sif-bridge.zhangshuaibing01.workers.dev/diagnostics/test-asin
          echo
