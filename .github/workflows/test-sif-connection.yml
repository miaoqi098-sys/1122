name: Test Sif Connection

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/test-sif-connection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check Sif bridge
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Sif connection-status ==='
          curl -sS https://1122-sif-bridge.zhangshuaibing01.workers.dev/connection-status
          echo
          echo '=== Sif tool catalog ==='
          curl -sS https://1122-sif-bridge.zhangshuaibing01.workers.dev/diagnostics/tools
          echo
