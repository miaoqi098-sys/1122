name: Verify Agent-3 S04 Decision Runtime V1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-agent3-s04-decision-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/a3-a1-s04-decision-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a3-a1-s04-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a3-a1-decision-item-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a3-a1-s03-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a3-a1-s02-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a3-a1-intake-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a3-competitor-price-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/r16-professional-agent-event-normalizer.js"
      - "数据板块/08_存储与访问层/cloudflare/r16-professional-agent-response-normalizer.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-priority.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-priority-policy.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-decision-formation.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a3-a1-s04-decision-runtime.contract.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/verify-agent3-s04-decision-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/a3-a1-s04-decision-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a3-a1-s04-decision-runtime.contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent3-s04-decision-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Agent-3 S04 reaches read-only priority and decision formation safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a3-a1-s04-decision-runtime.contract.test.mjs'
