name: Verify Agent-4 A1 S02 Runtime V1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-agent4-a1-s02-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/a4-advertising-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a4-a1-intake-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a4-a1-s02-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/s02-context.js"
      - "数据板块/08_存储与访问层/cloudflare/r16-professional-agent-event-normalizer.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a4-a1-s02-runtime.contract.test.mjs"
      - "Agent板块/运营组/Agent-1_运营总控智能体/技能模块/S01_事件校验/执行程序/runtime.js"
      - "Agent板块/运营组/Agent-1_运营总控智能体/技能模块/S02_上下文装载/执行程序/runtime.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent4-a1-s02-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Agent-4 S01 reaches S02 context safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a4-a1-s02-runtime.contract.test.mjs'
