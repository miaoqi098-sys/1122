name: Verify Agent-4 S04 Permission Boundary Runtime

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-agent4-s04-permission-boundary-runtime.yml"
      - "数据板块/08_存储与访问层/cloudflare/a4-a1-s04-permission-boundary-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a4-a1-s04-approval-gate-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-permission-decision.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a4-a1-s04-permission-boundary-runtime.contract.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/verify-agent4-s04-permission-boundary-runtime.yml"
      - "数据板块/08_存储与访问层/cloudflare/a4-a1-s04-permission-boundary-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a4-a1-s04-approval-gate-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-permission-decision.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a4-a1-s04-permission-boundary-runtime.contract.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent4-s04-permission-boundary-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Agent-4 cannot cross permission boundary without verified human approval
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a4-a1-s04-permission-boundary-runtime.contract.test.mjs'
