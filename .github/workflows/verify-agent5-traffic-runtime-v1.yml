name: Verify Agent-5 Traffic Runtime V1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-agent5-traffic-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/a5-traffic-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/r16-professional-agent-event-normalizer.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a5-traffic-runtime.contract.test.mjs"
      - "Agent板块/运营组/Agent-5_流量分析智能体/事件输出/TrafficIntelligenceEvent.schema.json"
      - "Agent板块/运营组/Agent-5_流量分析智能体/请求响应接口/TrafficAnalysisResponse.schema.json"
  pull_request:
    paths:
      - ".github/workflows/verify-agent5-traffic-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/a5-traffic-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/r16-professional-agent-event-normalizer.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a5-traffic-runtime.contract.test.mjs"
      - "Agent板块/运营组/Agent-5_流量分析智能体/事件输出/TrafficIntelligenceEvent.schema.json"
      - "Agent板块/运营组/Agent-5_流量分析智能体/请求响应接口/TrafficAnalysisResponse.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent5-traffic-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify Agent-5 read-only traffic signal reaches R16 safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a5-traffic-runtime.contract.test.mjs'
