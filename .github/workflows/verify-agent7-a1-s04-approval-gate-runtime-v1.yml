name: Verify Agent-7 S04 Approval Gate Runtime
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-agent7-a1-s04-approval-gate-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/a7-a1-s04-approval-gate-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a7-a1-s04-task-draft-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-approval-gate.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a7-a1-s04-approval-gate-runtime.contract.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent7-s04-approval-gate-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Agent-7 pending Approval Gate safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a7-a1-s04-approval-gate-runtime.contract.test.mjs'
