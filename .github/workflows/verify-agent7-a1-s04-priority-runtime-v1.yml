name: Verify Agent-7 A1 S04 Priority Runtime V1
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-agent7-a1-s04-priority-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/a7-a1-s04-priority-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a7-a1-s04-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/a7-a1-decision-item-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-runtime.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-priority.js"
      - "数据板块/08_存储与访问层/cloudflare/s04-priority-policy.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/a7-a1-s04-priority-runtime.contract.test.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent7-a1-s04-priority-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Agent-7 S04 Priority safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a7-a1-s04-priority-runtime.contract.test.mjs'
