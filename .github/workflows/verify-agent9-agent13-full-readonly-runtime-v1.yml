name: Verify Agent-9 Through Agent-13 Full Readonly Runtime V1
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-agent9-agent13-full-readonly-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/a9-a13-readonly-domain-runtimes.js"
      - "数据板块/08_存储与访问层/cloudflare/a9-a13-full-readonly-runtimes.js"
