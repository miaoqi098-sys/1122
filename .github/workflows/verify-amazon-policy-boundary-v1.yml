name: Verify Amazon Policy Boundary V1

on:
  push:
    paths:
      - '亚马逊政策边界/**'
      - 'UI界面设计板块/亚马逊政策边界中心/**'
      - 'UI界面设计板块/产品状态卡/ProductStateAggregatorV0/**'
      - 'UI界面设计板块/经营指挥中心/HomeCommandCenterAggregatorV0/**'
      - '数据板块/09_数据库迁移与版本/migrations/0090_amazon_policy_boundary.sql'
      - '.github/workflows/verify-amazon-policy-boundary-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate JSON contracts
        run: |
          node -e "for (const f of ['亚马逊政策边界/PolicySourceRegistry.v1.json','亚马逊政策边界/PolicyEvidence.schema.json','亚马逊政策边界/ObservedStateEvidence.schema.json','亚马逊政策边界/BoundaryClassification.v1.json','亚马逊政策边界/BoundaryResultCase.schema.json','亚马逊政策边界/CurrentResultIndex.v1.json','亚马逊政策边界/UIResultRouting.v1.json','亚马逊政策边界/PositiveOperatingMethod.schema.json','亚马逊政策边界/PositiveOperatingMethodIndex.v1.json','亚马逊政策边界/APRPattern.schema.json','亚马逊政策边界/APRClassification.v1.json','亚马逊政策边界/APRCurrentIndex.v1.json','UI界面设计板块/亚马逊政策边界中心/AmazonPolicyBoundaryView.schema.json','UI界面设计板块/亚马逊政策边界中心/PositiveOperatingMethodView.schema.json','UI界面设计板块/亚马逊政策边界中心/APRExplorationView.schema.json','UI界面设计板块/亚马逊政策边界中心/CurrentCoverageSnapshot.v1.json','UI界面设计板块/产品状态卡/ProductStateAggregatorV0/ProductPolicyImpactView.schema.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON contracts: PASS')"
      - name: Boundary engine tests
        run: node '亚马逊政策边界/runtime/policy-boundary-engine.test.js'
      - name: UI aggregator tests
        run: node 'UI界面设计板块/亚马逊政策边界中心/policy-boundary-view-aggregator.test.js'
      - name: Persistence migration parse test
        run: |
          sqlite3 /tmp/apb.db < '数据板块/09_数据库迁移与版本/migrations/0090_amazon_policy_boundary.sql'
          sqlite3 /tmp/apb.db ".tables" | grep amazon_policy_evidence
          sqlite3 /tmp/apb.db ".tables" | grep amazon_observed_state_evidence
          sqlite3 /tmp/apb.db ".tables" | grep amazon_boundary_result_case
      - name: Fail-closed authority assertion
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=['亚马逊政策边界/PolicySourceRegistry.v1.json','亚马逊政策边界/CurrentResultIndex.v1.json','亚马逊政策边界/UIResultRouting.v1.json','亚马逊政策边界/PositiveOperatingMethodIndex.v1.json','亚马逊政策边界/APRCurrentIndex.v1.json','UI界面设计板块/亚马逊政策边界中心/CurrentCoverageSnapshot.v1.json'];
          for(const f of files){const x=JSON.parse(fs.readFileSync(f,'utf8')); if(x.execution_authorized!==false && !(x.authority&&x.authority.execution_authorized===false)) throw new Error('execution boundary missing: '+f);}
          console.log('Fail-closed authority: PASS');
          NODE
