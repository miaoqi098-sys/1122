permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify DecisionItemBuilder contract
        run: node '数据板块/08_存储与访问层/cloudflare/tests/decision-item-builder.test.mjs'

      - name: Verify fail-closed S04 ingress contract
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-ingress.test.mjs'

      - name: Verify fail-closed S04 runtime contract
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-runtime.test.mjs'

      - name: Verify read-only S04 priority candidate contract
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-priority.test.mjs'

      - name: Verify deterministic read-only S04 priority policy
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-priority-policy.test.mjs'

      - name: Verify read-only S04 decision formation contract
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-decision-formation.test.mjs'

      - name: Verify fail-closed read-only S04 task draft contract
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-task-draft.test.mjs'

      - name: Verify fail-closed read-only S04 approval gate intake
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-approval-gate.test.mjs'

      - name: Verify fail-closed read-only S04 permission decision boundary
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-permission-decision.contract.test.mjs'

      - name: Verify fail-closed read-only S04 dispatch gate
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-dispatch-gate.contract.test.mjs'

      - name: Verify fail-closed read-only S04 dispatch envelope
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-dispatch-envelope.contract.test.mjs'

      - name: Verify fail-closed S04 execution result intake contract
        run: node '数据板块/08_存储与访问层/cloudflare/tests/s04-execution-result.contract.test.mjs'
