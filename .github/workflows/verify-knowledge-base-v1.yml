name: Verify Knowledge Base V1

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/verify-knowledge-base-v1.yml'
      - '知识板块/**'
      - '数据板块/08_存储与访问层/cloudflare/knowledge-store.js'
      - '数据板块/08_存储与访问层/cloudflare/ui-worker.js'
      - '数据板块/09_数据库迁移与版本/migrations/0092_knowledge_base.sql'
      - '数据板块/09_数据库迁移与版本/migrations/0094_remove_inferred_user_experience.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('知识板块/KnowledgeItem.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('知识板块/KnowledgeTaxonomy.v1.json','utf8'))"
          node --check '数据板块/08_存储与访问层/cloudflare/knowledge-store.js'
          node --check '数据板块/08_存储与访问层/cloudflare/ui-worker.js'
          grep -q 'CREATE TABLE IF NOT EXISTS knowledge_items' '数据板块/09_数据库迁移与版本/migrations/0092_knowledge_base.sql'
          grep -q 'KB-ADS-0001' '数据板块/09_数据库迁移与版本/migrations/0094_remove_inferred_user_experience.sql'
          grep -q 'execution_authorized = 0' '数据板块/09_数据库迁移与版本/migrations/0092_knowledge_base.sql'
          grep -q 'production_write_authorized = 0' '数据板块/09_数据库迁移与版本/migrations/0092_knowledge_base.sql'
      - name: Wait for data layer propagation
        run: sleep 25
      - name: Verify live knowledge search
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://1122-data-layer.zhangshuaibing01.workers.dev/api/v1/knowledge/search'
          curl -fsS --retry 15 --retry-delay 4             -H 'Origin: https://1122-web-agent.pages.dev'             -H 'Accept: application/json'             -D /tmp/headers.txt "$BASE?limit=30" -o /tmp/all.json
          grep -qi '^access-control-allow-origin: https://1122-web-agent.pages.dev' /tmp/headers.txt
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/all.json','utf8'));
          if(x.source_status!=='LIVE_D1_READ') throw new Error('knowledge source must be LIVE_D1_READ');
          if(x.read_only!==true || x.execution_authorized!==false || x.production_write_authorized!==false) throw new Error('knowledge permission boundary invalid');
          for(const id of ['KB-SYS-0001','KB-SYS-0002','KB-OPS-0001','KB-MKT-0001','KB-POL-0001']) if(!x.items.some(v=>v.knowledge_id===id)) throw new Error(id+' baseline missing');
          for(const id of ['KB-ADS-0001','KB-ADS-0002','KB-ADS-0003','KB-PRI-0001','KB-CAS-0001','KB-DEC-0001','KB-CAS-0002','KB-CON-0001']) if(x.items.some(v=>v.knowledge_id===id)) throw new Error(id+' inferred user experience must be removed');
          console.log(JSON.stringify({total:x.total,ids:x.items.map(v=>v.knowledge_id)},null,2));
          NODE
      - name: Verify baseline retrieval
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://1122-data-layer.zhangshuaibing01.workers.dev/api/v1/knowledge/search'
          curl -fsS --retry 8 --retry-delay 3 -H 'Origin: https://1122-web-agent.pages.dev' "$BASE?q=Vine" -o /tmp/vine.json
          curl -fsS --retry 8 --retry-delay 3 -H 'Origin: https://1122-web-agent.pages.dev' "$BASE?knowledge_type=SYSTEM_ENGINEERING" -o /tmp/system.json
          node - <<'NODE'
          const fs=require('fs');
          const vine=JSON.parse(fs.readFileSync('/tmp/vine.json','utf8'));
          const sys=JSON.parse(fs.readFileSync('/tmp/system.json','utf8'));
          if(!vine.items.some(v=>v.knowledge_id==='KB-OPS-0001')) throw new Error('Vine retrieval failed');
          for(const id of ['KB-SYS-0001','KB-SYS-0002']) if(!sys.items.some(v=>v.knowledge_id===id)) throw new Error('system filter missing '+id);
          NODE
      - name: Reject knowledge writes
        shell: bash
        run: |
          set -euo pipefail
          URL='https://1122-data-layer.zhangshuaibing01.workers.dev/api/v1/knowledge/search'
          code=$(curl -sS -o /tmp/post.json -w '%{http_code}' -X POST -H 'Origin: https://1122-web-agent.pages.dev' "$URL")
          test "$code" = '405'
          grep -q 'read_only' /tmp/post.json
