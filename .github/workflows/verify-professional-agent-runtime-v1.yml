name: Verify Professional Agent Runtime V1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/verify-professional-agent-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/r16-professional-agent-event-normalizer.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/r16-professional-agent-event-normalizer.contract.test.mjs"
      - "Agent板块/运营组/公共协议/ProfessionalAgentEventHandoff.schema.json"
      - "Agent板块/运营组/公共协议/事件字段映射表.md"
      - "Agent板块/运营组/Agent-1_运营总控智能体/输入规范/智能事件包.schema.json"
  pull_request:
    paths:
      - ".github/workflows/verify-professional-agent-runtime-v1.yml"
      - "数据板块/08_存储与访问层/cloudflare/r16-professional-agent-event-normalizer.js"
      - "数据板块/08_存储与访问层/cloudflare/tests/r16-professional-agent-event-normalizer.contract.test.mjs"
      - "Agent板块/运营组/公共协议/ProfessionalAgentEventHandoff.schema.json"
      - "Agent板块/运营组/公共协议/事件字段映射表.md"
      - "Agent板块/运营组/Agent-1_运营总控智能体/输入规范/智能事件包.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r16-event-normalizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify fail-closed R16 professional agent event normalizer
        run: node '数据板块/08_存储与访问层/cloudflare/tests/r16-professional-agent-event-normalizer.contract.test.mjs'
