permissions:
  contents: read

jobs:
  professional-agent-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify fail-closed R16 professional agent event normalizer
        run: node '数据板块/08_存储与访问层/cloudflare/tests/r16-professional-agent-event-normalizer.contract.test.mjs'

      - name: Verify fail-closed R16 professional agent response normalizer
        run: node '数据板块/08_存储与访问层/cloudflare/tests/r16-professional-agent-response-normalizer.contract.test.mjs'

      - name: Verify fail-closed Agent-2 read-only product status adapter
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-product-status-runtime.contract.test.mjs'

      - name: Verify fail-closed Agent-3 read-only competitor price adapter
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a3-competitor-price-runtime.contract.test.mjs'

      - name: Verify Agent-2 normalized event reaches A1 S01 intake safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-intake-runtime.contract.test.mjs'

      - name: Verify Agent-2 A1 intake reaches S02 context safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-s02-runtime.contract.test.mjs'

      - name: Verify Agent-2 S02 context reaches S03 conflict detection safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-s03-runtime.contract.test.mjs'

      - name: Verify Agent-2 S03 reaches DecisionItemBuilder safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-decision-item-runtime.contract.test.mjs'

      - name: Verify Agent-2 DecisionItem reaches fail-closed S04 ingress/runtime safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-s04-runtime.contract.test.mjs'

      - name: Verify Agent-2 S04 reaches read-only priority and decision formation safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-s04-decision-runtime.contract.test.mjs'

      - name: Verify Agent-2 decision reaches draft-only task generation safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-s04-task-draft-runtime.contract.test.mjs'

      - name: Verify Agent-2 task draft reaches approval gate intake safely
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-s04-approval-gate-runtime.contract.test.mjs'

      - name: Verify Agent-2 cannot cross permission boundary without verified human approval
        run: node '数据板块/08_存储与访问层/cloudflare/tests/a2-a1-s04-permission-boundary-runtime.contract.test.mjs'
