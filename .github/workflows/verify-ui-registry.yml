name: Verify public UI registry

on:
  pull_request:
  push:
    branches: [main]

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify every product UI is registered
        run: node tools/verify-ui-registry.mjs
