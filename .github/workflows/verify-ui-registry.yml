name: Verify public UI registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify generated artifact is current
        run: node tools/generate-ui-registry.mjs --check
      - name: Run UI registry unit tests
        run: node tools/ui-navigation-registry.test.mjs
      - name: Verify UI registry, Router, and Renderer contracts
        run: node tools/verify-ui-registry.mjs
