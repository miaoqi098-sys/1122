name: Verify Web Console V1

on:
  pull_request:
    paths:
      - 'web-console/**'
      - 'UI界面设计板块/NavigationRegistry.v2.json'
      - 'tools/generate-ui-registry.mjs'
      - 'tools/ui-navigation-registry-*.mjs'
      - '.github/workflows/verify-web-console-v1.yml'
  push:
    paths:
      - 'web-console/**'
      - 'UI界面设计板块/NavigationRegistry.v2.json'
      - 'tools/generate-ui-registry.mjs'
      - 'tools/ui-navigation-registry-*.mjs'
      - '.github/workflows/verify-web-console-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required files
        run: |
          test -f web-console/index.html
          test -f web-console/styles.css
          test -f web-console/app.js
          test -f web-console/registry.generated.js
          test -f web-console/live-pages.js
          test -f web-console/data/snapshots.js
          test -f web-console/data/data-source.js
      - name: JavaScript syntax check
        run: |
          node --check web-console/app.js
          node --check web-console/registry.generated.js
          node --check web-console/live-pages.js
          node --check web-console/data/snapshots.js
          node --check web-console/data/data-source.js
      - name: Verify core routes and modules
        run: |
          node tools/generate-ui-registry.mjs --check
          node tools/verify-ui-registry.mjs
          grep -q 'APR 市场玩法探索' web-console/registry.generated.js
          grep -q 'AOM 正向运营方法' web-console/registry.generated.js
          grep -q 'APB 政策与边界证据' web-console/registry.generated.js
          grep -q 'renderProducts' web-console/live-pages.js
          grep -q 'renderAgents' web-console/live-pages.js
          grep -q 'renderTasks' web-console/live-pages.js
      - name: Verify read-only data-source behavior
        run: |
          grep -q '1122-data-layer.zhangshuaibing01.workers.dev/api/v1/ui/bootstrap' web-console/data/data-source.js
          grep -q "method='GET'" web-console/data/data-source.js
          grep -q 'SNAPSHOT_FALLBACK' web-console/data/data-source.js
          grep -q 'live_data_verified:false' web-console/data/data-source.js
          ! grep -Eqi "method:['\"](POST|PUT|PATCH|DELETE)['\"]" web-console/data/data-source.js
      - name: Verify read-only safety text
        run: |
          grep -q '只读边界检查中' web-console/index.html
          grep -q '不拥有生产写权限' web-console/README.md
      - name: Static server smoke test
        run: |
          cd web-console
          python3 -m http.server 8080 >/tmp/1122-web.log 2>&1 &
          PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:8080/ | grep -q '1122 亚马逊智能经营系统'
          curl -fsS http://127.0.0.1:8080/app.js | grep -q 'function render'
          curl -fsS http://127.0.0.1:8080/registry.generated.js | grep -q 'AUTO-GENERATED'
          curl -fsS http://127.0.0.1:8080/live-pages.js | grep -q 'renderProducts'
          curl -fsS http://127.0.0.1:8080/data/data-source.js | grep -q '1122-data-layer'
          kill $PID
