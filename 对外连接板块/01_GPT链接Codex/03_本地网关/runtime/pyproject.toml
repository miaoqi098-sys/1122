[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amazon-agent-gpt-codex-gateway"
version = "0.1.0"
description = "Persistent local MCP gateway from authorized GPT conversations to Codex App Server."
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.13",
  "pydantic>=2.8,<3",
  "starlette>=0.38,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
gpt-codex-gateway = "gpt_codex_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_codex_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
