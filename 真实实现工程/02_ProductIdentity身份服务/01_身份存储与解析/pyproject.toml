[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amazon-product-identity-runtime"
version = "0.1.0"
description = "ProductIdentity storage and resolution service"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/product_identity"]
